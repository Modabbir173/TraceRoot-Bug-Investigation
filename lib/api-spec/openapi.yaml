openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TraceRoot issue investigation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: issues
    description: Bug investigation and issue tracking
  - name: dashboard
    description: Dashboard summaries and recent activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      summary: List and filter issues
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IssueStatus"
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/IssueSeverity"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Issues matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Create an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInput"
      responses:
        "201":
          description: Created issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
  /issues/{issueId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIssue
      tags: [issues]
      summary: Get an issue
      responses:
        "200":
          description: The requested issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          description: Issue not found
    patch:
      operationId: updateIssue
      tags: [issues]
      summary: Update an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueUpdate"
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          description: Issue not found
    delete:
      operationId: deleteIssue
      tags: [issues]
      summary: Delete an issue
      responses:
        "204":
          description: Issue deleted
        "404":
          description: Issue not found
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get issue counts for the dashboard
      responses:
        "200":
          description: Current issue counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent issue activity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
      responses:
        "200":
          description: Recent issue activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IssueStatus:
      type: string
      enum: [open, investigating, resolved]
    IssueSeverity:
      type: string
      enum: [critical, high, medium, low]
    Issue:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        service:
          type: string
        environment:
          type: string
        severity:
          $ref: "#/components/schemas/IssueSeverity"
        status:
          $ref: "#/components/schemas/IssueStatus"
        assignee:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - service
        - environment
        - severity
        - status
        - assignee
        - created_at
        - updated_at
    IssueInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 3
        service:
          type: string
          minLength: 1
        environment:
          type: string
          minLength: 1
        severity:
          $ref: "#/components/schemas/IssueSeverity"
        status:
          $ref: "#/components/schemas/IssueStatus"
        assignee:
          type: ["string", "null"]
      required:
        - title
        - description
        - service
        - environment
        - severity
    IssueUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 3
        service:
          type: string
          minLength: 1
        environment:
          type: string
          minLength: 1
        severity:
          $ref: "#/components/schemas/IssueSeverity"
        status:
          $ref: "#/components/schemas/IssueStatus"
        assignee:
          type: ["string", "null"]
    DashboardSummary:
      type: object
      properties:
        total:
          type: integer
        open:
          type: integer
        investigating:
          type: integer
        resolved:
          type: integer
        critical:
          type: integer
      required: [total, open, investigating, resolved, critical]
    Activity:
      type: object
      properties:
        id:
          type: string
        issue_id:
          type: string
        issue_title:
          type: string
        action:
          type: string
        actor:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, issue_id, issue_title, action, actor, created_at]

